# Dotfiles managed via mise (https://mise.jdx.dev/dotfiles.html), run from
# the repo root with `mise bootstrap dotfiles apply` (bin/install does this
# by default). Sources are resolved relative to this file's directory (the
# repo root). Replaces dotbot, which this repo used previously.

# ~/.config/gitcfg.local is not a symlink target of anything below, so it
# needs to be declared explicitly (mise auto-creates parent directories for
# [dotfiles] symlink targets). Mode pinned to 0777 to match the directory's
# existing permissions, so applying this doesn't silently tighten it to
# mise's 0755 default.
[bootstrap.directories."~/.config/gitcfg.local"]
mode = "0777"

[dotfiles."~/.gitconfig"]
source = "git/gitconfig"

[dotfiles."~/.gitignore"]
source = "git/gitcfg/gitignore_global"

[dotfiles."~/.gitattributes"]
source = "git/gitattributes"

[dotfiles."~/.config/gitcfg"]
source = "git/gitcfg"

[dotfiles."~/.aliases"]
source = "shell/aliases"

[dotfiles."~/.config/aliases"]
source = "shell/aliase"

[dotfiles."~/.exports"]
source = "shell/exports"

[dotfiles."~/.functions"]
source = "shell/functions"

[dotfiles."~/.profile"]
source = "shell/profile"

[dotfiles."~/.config/manage/python"]
source = "shell/manage-python"

[dotfiles."~/.python-version"]
source = ".python-version"

[dotfiles."~/.locals"]
source = "locals"

[dotfiles."~/.zshenv"]
source = "zsh/settings/zshenv"

[dotfiles."~/.zprofile"]
source = "zsh/settings/zprofile"

[dotfiles."~/.zsh/functions"]
source = "zsh/functions"

[dotfiles."~/.zsh/settings"]
source = "zsh/settings"

[dotfiles."~/.gnupg/gpg.conf"]
source = "tools/gnupg/gpg.conf"

[dotfiles."~/.gnupg/gpg-agent.conf"]
source = "tools/gnupg/gpg-agent.conf"

[dotfiles."~/.config/mc/ini"]
source = "tools/mc.ini"

[dotfiles."~/.config/starship"]
source = "terminal/starship"

[dotfiles."~/.config/zellij"]
source = "terminal/zellij"

[dotfiles."~/.config/scripts"]
source = "scripts"

[dotfiles."~/.config/.cmds"]
source = "shell/cmds"

[dotfiles."~/.zshrc"]
source = "zsh/zshrc"

[dotfiles."~/.zsh/zsh-autosuggestions"]
source = "vendor/zsh-autosuggestions"

[dotfiles."~/.bashrc"]
source = "shell/bashrc"

[dotfiles."~/.vimrc"]
source = "tools/vimrc"

[dotfiles."~/.curlrc"]
source = "tools/curlrc"

[dotfiles."~/.wgetrc"]
source = "tools/wgetrc"

[dotfiles."~/.gemrc"]
source = "tools/gemrc"

[dotfiles."~/.nvmrc"]
source = "tools/nvmrc"

[dotfiles."~/.pyenvrc"]
source = "tools/pyenvrc"

[dotfiles."~/.config/mise/config.toml"]
source = "tools/mise/config.toml"

[dotfiles."~/.config/mise/mise.lock"]
source = "tools/mise/mise.lock"

[dotfiles."~/.claude"]
source = "tools/claude"

# macOS-only. Note: the target path is "ApplicationSupport" (no space),
# which does not match the real macOS "Application Support" directory -
# a pre-existing bug carried over from dotbot's install.conf.yaml, not
# fixed here.
[dotfiles.iterm2-dynamic-profiles]
source = "terminal/iTerm/profiles"
variants = [
  { os = "macos", target = "~/Library/ApplicationSupport/iTerm2/DynamicProfiles" },
]

# dotbot linked this with force: false (won't overwrite a pre-existing
# real file) - apply this WITHOUT --force, separately from the rest.
[dotfiles.iterm2-xsfce-background]
source = "terminal/iTerm/xsfce-v2.png"
variants = [
  { os = "macos", target = "~/.config/iTerm2/xsfce-v2.png" },
]

# dotbot also linked these to a second, no-space "ApplicationSupport" path,
# which looks like a stray typo/duplicate rather than a real macOS path -
# intentionally dropped here, only the correct path is kept.
[dotfiles."~/Library/Application Support/Code/User/settings.json"]
source = "tools/vscode/settings.json"

[dotfiles."~/Library/Application Support/Code/User/keybindings.json"]
source = "tools/vscode/keybindings.json"

# macOS user defaults (https://mise.jdx.dev/bootstrap/macos-defaults.html),
# captured from `defaults read` on 2026-09-19. This file alone changes
# nothing - `mise bootstrap macos defaults apply` is what writes these.
# Dock autohide-delay/autohide-time-modifier and keyboard key_repeat/
# initial_key_repeat/fn_state are intentionally omitted: `defaults read`
# shows them unset on this machine, meaning macOS is using a compiled-in
# default that isn't exposed to `defaults read`. Guessing a number here
# risks `apply` silently changing real behavior instead of just recording
# it.
[bootstrap.macos.dock]
autohide = false
orientation = "bottom"
tilesize = 86
largesize = 86
magnification = true
show_recents = true
mru_spaces = false

[bootstrap.macos.finder]
sort_folders_first = false
save_new_documents_to_cloud = true
show_all_files = false
show_pathbar = false
show_status_bar = false
show_extensions_warning = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = true
press_and_hold = true

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = false

# iTerm2 has no friendly section, so this is raw. Found by diffing
# `defaults read com.googlecode.iterm2 > /tmp/after.txt` against a
# /tmp/before.txt taken before toggling Appearance > Panes in Preferences.
[bootstrap.macos.defaults."com.googlecode.iterm2"]
TerminalVMargin = 24

# Appearance > General. Values verified against iTermPreferences.h/.m in
# /Users/ik/source/self/go-work/iterm2-clone - all three already match the
# compiled default (TAB_STYLE_LIGHT / TAB_POSITION_TOP / positionTop = 0),
# recorded explicitly rather than because they differ from stock.
TabStyleWithAutomaticOption = 0 # Theme: Regular
TabViewType = 0 # Tab bar location: top
StatusBarPosition = 0 # Status bar location: top
SplitPaneDimmingAmount = 0.4 # Dimming: 40

# Profiles > default profile. GUID is fixed (not machine-random) inside the
# Dynamic Profile this repo deploys - terminal/iTerm/profiles/main.json,
# profile "personal" - via [dotfiles.iterm2-dynamic-profiles] below, so this
# stays valid on a fresh machine once dotfiles are applied.
"Default Bookmark Guid" = "D6A6B3B1-64CE-42CD-AB1E-7B9185072032"
