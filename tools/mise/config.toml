# https://github.com/jdx/mise
[settings]
# Let mise read .nvmrc/.node-version directly for projects not yet migrated
# to their own mise.toml - https://mise.jdx.dev/lang/node.html#nvmrc-node-version-and-package-json-support
# Python likewise reads `.python-version` files, replacing pyenv - https://mise.jdx.dev/lang/python.html
idiomatic_version_file_enable_tools = ["node", "python"]

[tools]
go = "1.27"
node = "26.9.0"
python = "3.14"
"pipx:pipenv" = "latest"
"pipx:pre-commit" = "latest"
